<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>PinoyBoosting Admin</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0a0a0a;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.25rem;
        background: #121212;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      .mark {
        width: 3rem;
        height: 3rem;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #1db954;
        color: #050505;
        font-weight: 900;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        margin-top: 1.25rem;
        color: #050505;
        background: #1db954;
        border-radius: 999px;
        padding: 0.75rem 1rem;
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">C</div>
      <h1>PinoyBoosting Admin</h1>
      <p>
        The Android app loads the live admin dashboard from pinoyboosting.com. If the site is
        temporarily unavailable, check your connection and reopen the app.
      </p>
      <a href="https://pinoyboosting.com/admin">Open Admin</a>
    </main>
  </body>
</html>
