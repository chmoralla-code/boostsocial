// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.force "androidx.core:core-splashscreen:1.2.0"
    }

    // Capacitor 8 compiles Android sources at Java 21. Keep Gradle's daemon
    // independent from the shell's JAVA_HOME by selecting the detected JDK 21
    // compiler for every Android Java compilation task.
    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        def toolchains = project.extensions.findByType(org.gradle.jvm.toolchain.JavaToolchainService)
        if (toolchains == null) {
            throw new GradleException("Java toolchain service is unavailable for ${project.path}")
        }

        javaCompiler = toolchains.compilerFor {
            languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        def toolchains = project.extensions.findByType(org.gradle.jvm.toolchain.JavaToolchainService)
        if (toolchains == null) {
            throw new GradleException("Java toolchain service is unavailable for ${project.path}")
        }

        javaLauncher = toolchains.launcherFor {
            languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
            project.android.buildToolsVersion = "36.0.0"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
